<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0c0b0a">
    <title>Asistente de Voz IA — Monitoreo de Incendios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #0c0b0a;
            --ink:     oklch(0.93 0.008 80);
            --ink-2:   oklch(0.93 0.008 80 / 0.62);
            --ink-3:   oklch(0.93 0.008 80 / 0.42);
            --line:    oklch(0.93 0.008 80 / 0.14);
            --line-2:  oklch(0.93 0.008 80 / 0.08);
            --accent:  oklch(0.72 0.13 45);
            --accent-hi: oklch(0.80 0.12 45);
            --cool:    oklch(0.72 0.13 200);
            --live:    oklch(0.76 0.16 150);
            --sans: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            letter-spacing: inherit;
        }

        button:focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: 2px;
        }

        /* ===== Raíz ===== */
        .app {
            min-height: 100vh;
            min-height: 100dvh;
            container-type: inline-size;
            display: flex;
            flex-direction: column;
            padding: max(clamp(18px, 3cqi, 40px), env(safe-area-inset-top)) clamp(18px, 3cqi, 40px) max(clamp(18px, 3cqi, 40px), env(safe-area-inset-bottom));
            gap: clamp(20px, 3cqi, 34px);
        }

        /* ===== Cabecera ===== */
        .hd {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px 24px;
            padding-bottom: clamp(14px, 2cqi, 20px);
            border-bottom: 1px solid var(--line);
        }

        .hd-brand {
            display: flex;
            align-items: flex-end;
            gap: clamp(12px, 2cqi, 20px);
            min-width: 0;
        }

        .hd-bar {
            width: 10px;
            height: clamp(30px, 4.4cqi, 46px);
            background: var(--accent);
            flex: none;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .hd h1 {
            margin-top: 2px;
            font-size: clamp(20px, 3.2cqi, 30px);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.05;
            text-wrap: pretty;
        }

        .hd-live {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.2em;
            color: var(--ink-2);
        }

        .blip {
            width: 7px;
            height: 7px;
            background: var(--live);
            flex: none;
            animation: blip 1.8s ease-in-out infinite;
        }

        @keyframes blip {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        /* ===== Cuerpo ===== */
        .main {
            flex: 1 1 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: clamp(26px, 4cqi, 64px);
        }

        .col-main {
            flex: 1 1 420px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: clamp(20px, 3cqi, 32px);
        }

        .col-log {
            flex: 1 1 340px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ===== Estado ===== */
        .status .eyebrow {
            font-size: 10.5px;
            letter-spacing: 0.24em;
        }

        .status-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 6px 18px;
            margin-top: 6px;
        }

        .status-word {
            font-size: clamp(34px, 6.6cqi, 64px);
            font-weight: 500;
            letter-spacing: -0.035em;
            line-height: 0.95;
            text-transform: uppercase;
        }

        .status-meta {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.14em;
            color: var(--ink-2);
        }

        /* ===== Onda de audio ===== */
        .wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: clamp(104px, 26cqi, 190px);
            width: 100%;
        }

        .wave i {
            flex: 1 1 0;
            min-width: 2px;
            height: 6%;
            background: oklch(0.72 0.13 45 / 0.35);
            display: block;
        }

        /* ===== Controles ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 26px;
        }

        .btn-primary {
            flex: 0 1 260px;
            min-height: 56px;
            padding: 0 26px;
            background: var(--accent);
            color: #14100d;
            font-family: var(--mono);
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.2em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: background 0.15s ease;
        }

        .btn-primary:hover { background: var(--accent-hi); }
        .btn-primary .btn-glyph { font-size: 15px; }

        .btn-secondary-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 22px;
            font-family: var(--mono);
            font-size: 11.5px;
            letter-spacing: 0.14em;
            color: var(--ink-2);
        }

        .btn-line {
            min-height: 44px;
            border-bottom: 1px solid oklch(0.93 0.008 80 / 0.25);
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .btn-line:hover {
            color: var(--ink);
            border-bottom-color: var(--accent);
        }

        /* ===== Transcripción ===== */
        .log-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--ink-3);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .log { display: block; }

        .log-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
            padding: 15px 0;
            border-bottom: 1px solid var(--line-2);
        }

        .log-row.is-pending { opacity: 0.55; }

        .log-role {
            flex: 0 0 92px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.2em;
            padding-top: 4px;
        }
        .log-row.is-tu .log-role { color: var(--accent); }
        .log-row.is-as .log-role { color: var(--cool); }

        .log-text {
            flex: 1 1 200px;
            min-width: 0;
            font-size: clamp(15px, 1.4cqi, 17px);
            line-height: 1.5;
            letter-spacing: -0.005em;
            text-wrap: pretty;
            word-break: break-word;
        }
        .log-row.is-tu .log-text { color: var(--ink-2); }
        .log-row.is-as .log-text { color: var(--ink); }

        .log-at {
            flex: 0 0 auto;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--ink-3);
            padding-top: 5px;
        }

        .log-empty {
            padding: 18px 0;
            font-family: var(--mono);
            font-size: 11.5px;
            line-height: 1.7;
            color: var(--ink-3);
        }

        /* ===== Pie ===== */
        .ft {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 24px;
            padding-top: clamp(12px, 2cqi, 18px);
            border-top: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        /* ===== Toast (plano) ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom));
            transform: translate(-50%, 10px);
            background: #14100d;
            color: var(--ink);
            border: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 10px 18px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 100;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (prefers-reduced-motion: reduce) {
            .blip { animation: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Cabecera -->
        <header class="hd">
            <div class="hd-brand">
                <span class="hd-bar" aria-hidden="true"></span>
                <div>
                    <div class="eyebrow">Monitoreo de incendios forestales</div>
                    <h1>Asistente de Voz IA</h1>
                </div>
            </div>
            <div class="hd-live"><span class="blip" aria-hidden="true"></span>EN VIVO</div>
        </header>

        <!-- Cuerpo -->
        <main class="main">
            <section class="col-main">
                <div class="status">
                    <div class="eyebrow">Estado</div>
                    <div class="status-row">
                        <div class="status-word" id="statusWord" aria-live="polite">En espera</div>
                        <div class="status-meta" id="statusMeta">00:00 · TURNO 00 · MICRÓFONO INACTIVO</div>
                    </div>
                </div>

                <div class="wave" id="wave" aria-hidden="true"></div>

                <div class="actions">
                    <button class="btn-primary" id="orbButton" aria-pressed="false" aria-label="Iniciar o detener la escucha">
                        <span id="primaryLabel">INICIAR ESCUCHA</span>
                        <span class="btn-glyph" id="primaryGlyph">→</span>
                    </button>
                    <div class="btn-secondary-group">
                        <button class="btn-line" id="btnPausar">DETENER CONVERSACIÓN</button>
                        <button class="btn-line" id="btnReiniciar">REINICIAR</button>
                    </div>
                </div>
            </section>

            <section class="col-log">
                <div class="log-head">
                    <span>Transcripción</span><span id="lineCount">00 INTERVENCIONES</span>
                </div>
                <div class="log" id="log"></div>
            </section>
        </main>

        <!-- Pie -->
        <footer class="ft">
            <span>Conversación continua manos libres</span>
            <span>Groq LLM + Speech API</span>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== Configuración =====
        const BACKEND_URL = (window.location.origin && window.location.origin.startsWith("http"))
            ? window.location.origin
            : "https://asistentevozia.onrender.com";

        const ACCENT = "oklch(0.72 0.13 45)";
        const COOL = "oklch(0.72 0.13 200)";
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // ===== Elementos =====
        const el = {
            wave: document.getElementById("wave"),
            statusWord: document.getElementById("statusWord"),
            statusMeta: document.getElementById("statusMeta"),
            primaryBtn: document.getElementById("orbButton"),
            primaryLabel: document.getElementById("primaryLabel"),
            primaryGlyph: document.getElementById("primaryGlyph"),
            log: document.getElementById("log"),
            lineCount: document.getElementById("lineCount"),
            btnPausar: document.getElementById("btnPausar"),
            btnReiniciar: document.getElementById("btnReiniciar"),
            toast: document.getElementById("toast"),
        };

        // ===== Estado =====
        const ESTADOS = {
            INACTIVO: "inactivo",
            ESCUCHANDO: "escuchando",
            PENSANDO: "pensando",
            HABLANDO: "hablando"
        };
        const STATUS_WORD = {
            inactivo: "En espera",
            escuchando: "Escuchando",
            pensando: "Procesando",
            hablando: "Respondiendo"
        };
        const STATUS_META = {
            inactivo: "MICRÓFONO INACTIVO",
            escuchando: "CAPTURA DE AUDIO EN CURSO",
            pensando: "CONSULTA AL MODELO",
            hablando: "SÍNTESIS DE VOZ"
        };

        let estadoActual = ESTADOS.INACTIVO;
        let conversacionActiva = false;
        let elapsedSeconds = 0;
        let turnCount = 0;
        let clockInterval = null;
        let transcript = [];        // { role: 'tu' | 'asistente', text, at }
        let pendingUserText = "";

        // Reconocimiento de voz (SpeechRecognition)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecognizing = false;
        let speechTimeout = null;
        let ttsFallbackTimer = null;

        // ===== Utilidades de vista =====
        function stamp() {
            const s = elapsedSeconds;
            return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
            }[c]));
        }

        function mostrarToast(msg) {
            el.toast.textContent = msg;
            el.toast.classList.add("show");
            setTimeout(() => el.toast.classList.remove("show"), 3000);
        }

        function refreshStatus() {
            el.statusWord.textContent = STATUS_WORD[estadoActual] || STATUS_WORD.inactivo;
            el.statusMeta.textContent = stamp()
                + " · TURNO " + String(turnCount).padStart(2, "0")
                + " · " + (STATUS_META[estadoActual] || STATUS_META.inactivo);
            el.primaryLabel.textContent = conversacionActiva ? "ESCUCHA ACTIVA" : "INICIAR ESCUCHA";
            el.primaryGlyph.textContent = conversacionActiva ? "●" : "→";
            el.primaryBtn.setAttribute("aria-pressed", conversacionActiva ? "true" : "false");
        }

        function renderTranscript() {
            el.lineCount.textContent = String(transcript.length).padStart(2, "0") + " INTERVENCIONES";

            const lines = transcript.slice();
            if (pendingUserText) {
                lines.push({ role: "tu", text: pendingUserText, at: stamp(), pending: true });
            }

            if (lines.length === 0) {
                el.log.innerHTML = '<div class="log-empty">Sin registro. Inicia la escucha para<br>comenzar la conversación continua.</div>';
                return;
            }

            const last = lines.slice(-4);
            el.log.innerHTML = last.map((l, i) => {
                const role = l.role === "tu" ? "TÚ" : "ASISTENTE";
                const roleClass = l.role === "tu" ? "is-tu" : "is-as";
                const pendingClass = l.pending ? " is-pending" : "";
                const live = (i === last.length - 1) ? ' aria-live="polite"' : "";
                return '<div class="log-row ' + roleClass + pendingClass + '">'
                    + '<div class="log-role">' + role + '</div>'
                    + '<div class="log-text"' + live + '>' + escapeHtml(l.text) + '</div>'
                    + '<div class="log-at">' + l.at + '</div>'
                    + '</div>';
            }).join("");
        }

        function pushLine(role, text) {
            transcript.push({ role, text, at: stamp() });
            renderTranscript();
        }

        // Actualiza el estado del asistente (clase lógica + vista)
        function setEstado(nuevoEstado) {
            estadoActual = nuevoEstado;
            refreshStatus();
        }

        // ===== Onda de audio ===== (un solo requestAnimationFrame escribe el DOM directamente)
        const bars = [];
        (function buildWave() {
            for (let i = 0; i < 56; i++) {
                const b = document.createElement("i");
                el.wave.appendChild(b);
                bars.push(b);
            }
        })();

        let waveT = 0;
        function paintWave() {
            const cfg = ({
                inactivo:   { amp: 0.04, base: 4,  alpha: 0.28, speed: 0.012, hue: null },
                escuchando: { amp: 0.82, base: 6,  alpha: 1.00, speed: 0.075, hue: null },
                pensando:   { amp: 0.16, base: 8,  alpha: 0.50, speed: 0.030, hue: null },
                hablando:   { amp: 0.55, base: 10, alpha: 0.85, speed: 0.050, hue: COOL }
            })[estadoActual] || { amp: 0.04, base: 4, alpha: 0.28, speed: 0.012, hue: null };

            waveT += 1;
            const n = bars.length;
            for (let i = 0; i < n; i++) {
                const x = i / n;
                const t = waveT * cfg.speed;
                const env = Math.pow(Math.sin(Math.PI * x), 0.7);
                const w = 0.5 + 0.5 * Math.sin(t + i * 0.42) * Math.sin(t * 0.53 + i * 0.11);
                const jitter = estadoActual === ESTADOS.ESCUCHANDO ? 0.35 * Math.random() : 0;
                const h = cfg.base + cfg.amp * 100 * env * (0.45 * w + jitter);
                const c = bars[i];
                c.style.height = Math.max(2, Math.min(100, h)) + "%";
                c.style.background = (cfg.hue || ACCENT).replace(")", " / " + cfg.alpha.toFixed(2) + ")");
            }
        }

        if (prefersReducedMotion) {
            bars.forEach(b => {
                b.style.height = "6%";
                b.style.background = ACCENT.replace(")", " / 0.30)");
            });
        } else {
            (function loop() { paintWave(); requestAnimationFrame(loop); })();
        }

        // ===== Reconocimiento de voz =====
        function initRecognition() {
            if (!SpeechRecognition) {
                mostrarToast("Tu navegador no soporta Reconocimiento de Voz. Usa Chrome o Edge.");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = "es-CO";
            rec.continuous = false; // Ciclo continuo manejado manualmente para máxima compatibilidad
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            let finalTranscript = "";

            rec.onstart = () => {
                isRecognizing = true;
                finalTranscript = "";
                if (conversacionActiva && estadoActual === ESTADOS.ESCUCHANDO) {
                    setEstado(ESTADOS.ESCUCHANDO);
                }
            };

            rec.onresult = (event) => {
                let interimTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const transcriptActual = (finalTranscript || interimTranscript).trim();
                if (transcriptActual) {
                    pendingUserText = transcriptActual;
                    renderTranscript();
                }

                // Debounce de silencio: cuando el usuario termina de hablar
                if (transcriptActual.length > 2) {
                    clearTimeout(speechTimeout);
                    speechTimeout = setTimeout(() => {
                        try { rec.stop(); } catch (e) {}
                    }, 1200);
                }
            };

            rec.onerror = (event) => {
                isRecognizing = false;
                if (event.error !== "no-speech") {
                    console.warn("SpeechRecognition error:", event.error);
                }
                if (conversacionActiva && estadoActual === ESTADOS.ESCUCHANDO) {
                    setTimeout(() => iniciarReconocimientoVoz(), 400);
                }
            };

            rec.onend = () => {
                isRecognizing = false;
                clearTimeout(speechTimeout);

                if (!conversacionActiva) {
                    setEstado(ESTADOS.INACTIVO);
                    return;
                }

                const pregunta = finalTranscript.trim();
                if (pregunta.length > 1) {
                    enviarPreguntaAlBackend(pregunta);
                } else {
                    // Silencio o sin audio: reanudar escucha de inmediato
                    pendingUserText = "";
                    renderTranscript();
                    if (conversacionActiva && estadoActual === ESTADOS.ESCUCHANDO) {
                        setTimeout(() => iniciarReconocimientoVoz(), 250);
                    }
                }
            };

            return rec;
        }

        function iniciarReconocimientoVoz() {
            if (!conversacionActiva) return;
            if (estadoActual === ESTADOS.HABLANDO || estadoActual === ESTADOS.PENSANDO) return;

            setEstado(ESTADOS.ESCUCHANDO);

            try {
                if (!recognition) recognition = initRecognition();
                if (recognition && !isRecognizing) recognition.start();
            } catch (err) {
                console.warn("Aviso al iniciar recognition:", err);
                try { recognition.abort(); } catch (e) {}
                setTimeout(() => {
                    if (conversacionActiva && estadoActual === ESTADOS.ESCUCHANDO && !isRecognizing) {
                        try { recognition.start(); } catch (e) {}
                    }
                }, 300);
            }
        }

        // ===== Backend =====
        async function enviarPreguntaAlBackend(texto) {
            pendingUserText = "";
            pushLine("tu", texto);
            setEstado(ESTADOS.PENSANDO);

            try {
                const response = await fetch(`${BACKEND_URL}/preguntar`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ texto: texto })
                });

                if (!response.ok) {
                    throw new Error(`Error en el servidor: HTTP ${response.status}`);
                }

                const data = await response.json();
                const respuesta = data.respuesta || "No recibí respuesta del asistente.";

                turnCount += 1;
                pushLine("asistente", respuesta);
                refreshStatus();
                reproducirVoz(respuesta);

            } catch (error) {
                console.error("Error al consultar backend:", error);
                const errorMsg = "Disculpa, hubo un problema de conexión con el servidor.";
                pushLine("asistente", errorMsg);
                reproducirVoz(errorMsg);
            }
        }

        // ===== Síntesis de voz (Text-to-Speech) con protección anti-bloqueo =====
        function reproducirVoz(texto) {
            if (!("speechSynthesis" in window)) {
                mostrarToast("Tu navegador no soporta síntesis de voz.");
                iniciarReconocimientoVoz();
                return;
            }

            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }

            window.speechSynthesis.cancel();
            setEstado(ESTADOS.HABLANDO);

            const utterance = new SpeechSynthesisUtterance(texto);
            window.activeUtterance = utterance; // Evita que el GC de Chrome mate el evento onend

            utterance.lang = "es-CO";
            utterance.rate = 1.05;
            utterance.pitch = 1.0;

            const voces = window.speechSynthesis.getVoices();
            const vozEspanol = voces.find(v => v.lang.startsWith("es") && (v.name.includes("Natural") || v.name.includes("Google") || v.name.includes("Sabina") || v.name.includes("Helena")))
                            || voces.find(v => v.lang.startsWith("es"));
            if (vozEspanol) utterance.voice = vozEspanol;

            let habladoTerminado = false;

            function finalizarLocucionYEscuchar() {
                if (habladoTerminado) return;
                habladoTerminado = true;

                clearTimeout(ttsFallbackTimer);
                window.activeUtterance = null;

                if (!conversacionActiva) {
                    setEstado(ESTADOS.INACTIVO);
                    return;
                }

                setEstado(ESTADOS.ESCUCHANDO);
                setTimeout(() => {
                    if (conversacionActiva && estadoActual === ESTADOS.ESCUCHANDO) {
                        iniciarReconocimientoVoz();
                    }
                }, 350);
            }

            utterance.onend = () => finalizarLocucionYEscuchar();
            utterance.onerror = (e) => {
                console.warn("SpeechSynthesis error:", e);
                finalizarLocucionYEscuchar();
            };

            // Fallback: si el bug de Chrome impide 'onend', forzar reactivación
            const duracionEstimadaMs = Math.max(3000, Math.ceil(texto.length * 85) + 1200);
            ttsFallbackTimer = setTimeout(() => {
                if (!habladoTerminado) {
                    console.log("Activando fallback de seguridad para continuar conversación");
                    finalizarLocucionYEscuchar();
                }
            }, duracionEstimadaMs);

            window.speechSynthesis.speak(utterance);
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // ===== Ciclo de conversación =====
        function iniciarConversacion() {
            if (!recognition) recognition = initRecognition();
            conversacionActiva = true;

            if (!clockInterval) {
                clockInterval = setInterval(() => {
                    elapsedSeconds += 1;
                    refreshStatus();
                }, 1000);
            }

            window.speechSynthesis.cancel();
            refreshStatus();
            iniciarReconocimientoVoz();
            mostrarToast("Escucha iniciada. Habla cuando quieras.");
        }

        function detenerConversacion() {
            conversacionActiva = false;
            clearTimeout(ttsFallbackTimer);
            clearTimeout(speechTimeout);
            clearInterval(clockInterval);
            clockInterval = null;
            window.speechSynthesis.cancel();
            window.activeUtterance = null;

            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }

            pendingUserText = "";
            setEstado(ESTADOS.INACTIVO);
            pushLine("asistente", "Conversación pausada. Toca INICIAR ESCUCHA para reanudar.");
            mostrarToast("Conversación detenida.");
        }

        // ===== Eventos =====
        el.primaryBtn.addEventListener("click", () => {
            if (!conversacionActiva) {
                iniciarConversacion();
            } else {
                detenerConversacion();
            }
        });

        el.btnPausar.addEventListener("click", detenerConversacion);

        el.btnReiniciar.addEventListener("click", () => {
            detenerConversacion();
            transcript = [];
            pendingUserText = "";
            elapsedSeconds = 0;
            turnCount = 0;
            renderTranscript();
            refreshStatus();
            setTimeout(() => iniciarConversacion(), 300);
        });

        // ===== Arranque =====
        refreshStatus();
        renderTranscript();
    </script>
</body>
</html>
