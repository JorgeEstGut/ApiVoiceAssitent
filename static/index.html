<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Voz IA — Monitoreo de Incendios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #070d1e;
            --bg-card: #0f1a36;
            --border-color: #1e2c52;
            --accent-orange: #ff6b35;
            --accent-flame: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.4);
            --accent-green: #10b981;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --pulse-size: 190px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        /* Cabecera */
        header {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f97316, #ef4444);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .badge-live {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-live::before {
            content: "";
            width: 6px;
            height: 6px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Área central del orbe de voz */
        main {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            text-align: center;
        }

        .orb-container {
            position: relative;
            width: var(--pulse-size);
            height: var(--pulse-size);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .orb-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--accent-glow);
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .orb-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1c274c, #0f172a);
            border: 2px solid var(--border-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .orb-button:hover {
            transform: scale(1.03);
            border-color: var(--accent-flame);
        }

        .orb-button:active {
            transform: scale(0.97);
        }

        .orb-icon {
            font-size: 42px;
            margin-bottom: 6px;
            transition: transform 0.3s ease;
        }

        .orb-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* Estados dinámicos del orbe */
        /* 1. Estado: Escuchando (pulsación naranja viva) */
        .orb-container.escuchando .orb-button {
            border-color: var(--accent-orange);
            background: linear-gradient(135deg, #2b1d16, #141b2d);
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.5);
        }
        .orb-container.escuchando .orb-label {
            color: var(--accent-orange);
        }
        .orb-container.escuchando .orb-pulse {
            animation: pulse-wave 1.8s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 2. Estado: Pensando (resplandor giratorio / respiración) */
        .orb-container.pensando .orb-button {
            border-color: #f59e0b;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
            animation: thinking-glow 1.2s infinite ease-in-out;
        }
        .orb-container.pensando .orb-label {
            color: #fbbf24;
        }

        /* 3. Estado: Hablando (onda expansiva rítmica) */
        .orb-container.hablando .orb-button {
            border-color: #38bdf8;
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.6);
            background: linear-gradient(135deg, #102a45, #0f172a);
        }
        .orb-container.hablando .orb-label {
            color: #38bdf8;
        }
        .orb-container.hablando .orb-pulse {
            background: rgba(56, 189, 248, 0.3);
            animation: pulse-wave 1.2s infinite ease-out;
        }

        @keyframes pulse-wave {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes thinking-glow {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.04); filter: brightness(1.2); }
        }

        /* Visualizador de audio simulación */
        .audio-bars {
            display: none;
            gap: 4px;
            align-items: center;
            justify-content: center;
            height: 18px;
            margin-top: 4px;
        }

        .orb-container.hablando .audio-bars,
        .orb-container.escuchando .audio-bars {
            display: flex;
        }

        .bar {
            width: 3px;
            height: 6px;
            background-color: currentColor;
            border-radius: 99px;
            animation: bar-anim 0.8s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.4s; }

        @keyframes bar-anim {
            from { height: 4px; }
            to { height: 18px; }
        }

        /* Subtítulos en pantalla */
        .subtitles-box {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 20px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .subtitle-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .subtitle-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .tag-user {
            background-color: rgba(249, 115, 22, 0.2);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .tag-bot {
            background-color: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .subtitle-text {
            color: var(--text-primary);
            word-break: break-word;
        }

        .subtitle-text.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Botones de control secundarios */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .btn-control {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-control:hover {
            color: var(--text-primary);
            border-color: #475569;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .btn-control.danger:hover {
            color: #f87171;
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.08);
        }

        /* Pie de página */
        footer {
            width: 100%;
            max-width: 520px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Toast de aviso */
        .toast {
            position: fixed;
            bottom: 20px;
            background: #1e293b;
            color: #f1f5f9;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #334155;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Encabezado -->
    <header>
        <div class="brand">
            <div class="brand-icon">🔥</div>
            <div class="brand-text">
                <h1>Asistente de Voz IA</h1>
                <p>Monitoreo de Incendios Forestales</p>
            </div>
        </div>
        <div class="badge-live">EN VIVO</div>
    </header>

    <!-- Centro interactivo -->
    <main>
        <div class="orb-container" id="orbContainer">
            <div class="orb-pulse"></div>
            <button class="orb-button" id="orbButton" aria-label="Iniciar o pausar conversación continua">
                <span class="orb-icon" id="orbIcon">🎙️</span>
                <span class="orb-label" id="orbLabel">Toca para Iniciar</span>
                <div class="audio-bars">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </button>
        </div>

        <!-- Subtítulos en pantalla -->
        <div class="subtitles-box">
            <div class="subtitle-line" id="userSubLine">
                <span class="subtitle-tag tag-user">Tú</span>
                <span class="subtitle-text empty" id="userSubText">Esperando que inicies la conversación...</span>
            </div>
            <div class="subtitle-line" id="botSubLine">
                <span class="subtitle-tag tag-bot">Asistente</span>
                <span class="subtitle-text empty" id="botSubText">Toca el micrófono una vez y habla con naturalidad.</span>
            </div>
        </div>

        <!-- Botones de control secundarios -->
        <div class="controls">
            <button class="btn-control danger" id="btnPausar">⏹️ Detener conversación</button>
            <button class="btn-control" id="btnReiniciar">🔄 Reiniciar</button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        Conversación continua manos libres • Groq LLM + Speech API
    </footer>

    <!-- Toast de notificaciones -->
    <div class="toast" id="toast"></div>

    <script>
        // Variable JS configurable para la URL del backend
        const BACKEND_URL = (window.location.origin && window.location.origin.startsWith("http"))
            ? window.location.origin
            : "https://asistentevozia.onrender.com";

        // Elementos del DOM
        const orbContainer = document.getElementById("orbContainer");
        const orbButton = document.getElementById("orbButton");
        const orbIcon = document.getElementById("orbIcon");
        const orbLabel = document.getElementById("orbLabel");
        const userSubText = document.getElementById("userSubText");
        const botSubText = document.getElementById("botSubText");
        const btnPausar = document.getElementById("btnPausar");
        const btnReiniciar = document.getElementById("btnReiniciar");
        const toastEl = document.getElementById("toast");

        // Estados del asistente
        const ESTADOS = {
            INACTIVO: "inactivo",
            ESCUCHANDO: "escuchando",
            PENSANDO: "pensando",
            HABLANDO: "hablando"
        };
        let estadoActual = ESTADOS.INACTIVO;
        let conversacionActiva = false;

        // Reconocimiento de voz (SpeechRecognition)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let speechTimeout = null;

        function mostrarToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            setTimeout(() => toastEl.classList.remove("show"), 3000);
        }

        // Actualizar visualmente el orbe
        function setEstado(nuevoEstado, textoPersonalizado = "") {
            estadoActual = nuevoEstado;
            orbContainer.classList.remove("escuchando", "pensando", "hablando");

            switch (nuevoEstado) {
                case ESTADOS.ESCUCHANDO:
                    orbContainer.classList.add("escuchando");
                    orbIcon.textContent = "👂";
                    orbLabel.textContent = textoPersonalizado || "Te escucho...";
                    break;
                case ESTADOS.PENSANDO:
                    orbContainer.classList.add("pensando");
                    orbIcon.textContent = "⚡";
                    orbLabel.textContent = textoPersonalizado || "Consultando...";
                    break;
                case ESTADOS.HABLANDO:
                    orbContainer.classList.add("hablando");
                    orbIcon.textContent = "🔊";
                    orbLabel.textContent = textoPersonalizado || "Respondiendo...";
                    break;
                case ESTADOS.INACTIVO:
                default:
                    orbIcon.textContent = "🎙️";
                    orbLabel.textContent = "Toca para Iniciar";
                    break;
            }
        }

        // Inicializar Reconocimiento de Voz
        function initRecognition() {
            if (!SpeechRecognition) {
                mostrarToast("Tu navegador no soporta Reconocimiento de Voz. Usa Google Chrome o Edge.");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = "es-CO";
            rec.continuous = false; // Manejado en ciclo continuo manual para máxima estabilidad en móvil
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            let finalTranscript = "";

            rec.onstart = () => {
                finalTranscript = "";
                if (conversacionActiva && estadoActual !== ESTADOS.HABLANDO && estadoActual !== ESTADOS.PENSANDO) {
                    setEstado(ESTADOS.ESCUCHANDO);
                }
            };

            rec.onresult = (event) => {
                let interimTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const transcriptActual = finalTranscript || interimTranscript;
                if (transcriptActual.trim()) {
                    userSubText.textContent = `"${transcriptActual.trim()}"`;
                    userSubText.classList.remove("empty");
                }

                // Debounce de silencio: si el usuario deja de hablar por 1.2 segundos tras haber dicho algo
                if (transcriptActual.trim().length > 3) {
                    clearTimeout(speechTimeout);
                    speechTimeout = setTimeout(() => {
                        try { rec.stop(); } catch (e) {}
                    }, 1200);
                }
            };

            rec.onerror = (event) => {
                if (event.error !== "no-speech") {
                    console.warn("SpeechRecognition error:", event.error);
                }
                // Si la conversación sigue activa, reintentar escuchar sin romper el ciclo
                if (conversacionActiva && estadoActual === ESTADOS.ESCUCHANDO) {
                    setTimeout(() => reiniciarEscucha(), 600);
                }
            };

            rec.onend = () => {
                clearTimeout(speechTimeout);
                if (!conversacionActiva) {
                    setEstado(ESTADOS.INACTIVO);
                    return;
                }

                const pregunta = finalTranscript.trim();
                if (pregunta.length > 1) {
                    // Hay pregunta válida, enviarla al backend
                    enviarPreguntaAlBackend(pregunta);
                } else {
                    // No se captó texto (silencio), seguir escuchando de inmediato
                    if (conversacionActiva && estadoActual !== ESTADOS.PENSANDO && estadoActual !== ESTADOS.HABLANDO) {
                        reiniciarEscucha();
                    }
                }
            };

            return rec;
        }

        function reiniciarEscucha() {
            if (!conversacionActiva) return;
            try {
                if (recognition) {
                    recognition.abort();
                    setTimeout(() => {
                        if (conversacionActiva && estadoActual !== ESTADOS.HABLANDO && estadoActual !== ESTADOS.PENSANDO) {
                            setEstado(ESTADOS.ESCUCHANDO);
                            recognition.start();
                        }
                    }, 250);
                }
            } catch (e) {
                console.error("Error al reiniciar escucha:", e);
            }
        }

        // Enviar pregunta transcrita a POST /preguntar
        async function enviarPreguntaAlBackend(texto) {
            setEstado(ESTADOS.PENSANDO);
            botSubText.textContent = "Procesando con Groq...";
            botSubText.classList.add("empty");

            try {
                const response = await fetch(`${BACKEND_URL}/preguntar`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ texto: texto })
                });

                if (!response.ok) {
                    throw new Error(`Error en el servidor: HTTP ${response.status}`);
                }

                const data = await response.json();
                const respuesta = data.respuesta || "No recibí respuesta del asistente.";

                botSubText.textContent = respuesta;
                botSubText.classList.remove("empty");

                // Hablar la respuesta
                reproducirVoz(respuesta);

            } catch (error) {
                console.error("Error al consultar backend:", error);
                const errorMsg = "Disculpa, hubo un problema de conexión con el servidor.";
                botSubText.textContent = errorMsg;
                botSubText.classList.remove("empty");
                reproducirVoz(errorMsg);
            }
        }

        // Síntesis de voz (Text-to-Speech)
        function reproducirVoz(texto) {
            if (!("speechSynthesis" in window)) {
                mostrarToast("Tu navegador no soporta síntesis de voz.");
                reiniciarEscucha();
                return;
            }

            window.speechSynthesis.cancel(); // Cancelar locuciones previas
            setEstado(ESTADOS.HABLANDO);

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = "es-CO";
            utterance.rate = 1.05; // Ritmo ágil y natural
            utterance.pitch = 1.0;

            // Intentar buscar una voz en español de alta calidad
            const voces = window.speechSynthesis.getVoices();
            const vozEspanol = voces.find(v => v.lang.startsWith("es") && (v.name.includes("Natural") || v.name.includes("Google") || v.name.includes("Sabina") || v.name.includes("Helena"))) 
                            || voces.find(v => v.lang.startsWith("es"));
            if (vozEspanol) {
                utterance.voice = vozEspanol;
            }

            utterance.onend = () => {
                // En cuanto el asistente termina de hablar, vuelve automáticamente a escuchar
                if (conversacionActiva) {
                    setTimeout(() => {
                        reiniciarEscucha();
                    }, 350);
                } else {
                    setEstado(ESTADOS.INACTIVO);
                }
            };

            utterance.onerror = (e) => {
                console.warn("SpeechSynthesis error:", e);
                if (conversacionActiva) {
                    reiniciarEscucha();
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // Cargar voces al inicio
        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // Iniciar el ciclo de conversación continuo
        function iniciarConversacion() {
            if (!recognition) {
                recognition = initRecognition();
            }
            if (!recognition) return;

            conversacionActiva = true;
            window.speechSynthesis.cancel();
            reiniciarEscucha();
            mostrarToast("Conversación iniciada. Habla cuando quieras.");
        }

        // Detener conversación
        function detenerConversacion() {
            conversacionActiva = false;
            window.speechSynthesis.cancel();
            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }
            setEstado(ESTADOS.INACTIVO);
            userSubText.textContent = "Conversación pausada.";
            userSubText.classList.add("empty");
            botSubText.textContent = "Toca el botón central para reanudar.";
            botSubText.classList.add("empty");
            mostrarToast("Conversación detenida.");
        }

        // Eventos
        orbButton.addEventListener("click", () => {
            if (!conversacionActiva) {
                iniciarConversacion();
            } else {
                detenerConversacion();
            }
        });

        btnPausar.addEventListener("click", detenerConversacion);

        btnReiniciar.addEventListener("click", () => {
            detenerConversacion();
            userSubText.textContent = "Esperando que inicies la conversación...";
            botSubText.textContent = "Toca el micrófono una vez y habla con naturalidad.";
            setTimeout(() => iniciarConversacion(), 300);
        });
    </script>
</body>
</html>
